extends: existence
message: "'%s' is a claim about use in the field. Cite evidence or state what the code does."
level: warning
ignorecase: true
tokens:
  - (?:never|not|rarely|often|commonly|frequently) (?:been )?(?:reported|observed|encountered|seen)
  - in practice
  - in the wild
  - in production
  - real-world
  - users (?:have|will|may|might|often|rarely|commonly)
  - most users
  - widely used
