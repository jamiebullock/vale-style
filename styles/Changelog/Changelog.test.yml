- name: a well-formed file passes every rule
  input: |
    # Changelog

    ## [1.1.0] - 2026-02-01

    ### Changed

    - **Breaking:** rename `ex_mean` to `ex_average` ([#14](https://example.com/o/n/pull/14))
    - Raise the minimum CMake version to 3.21 ([#13](https://example.com/o/n/pull/13), [#15](https://example.com/o/n/issues/15))

    ### Added

    - Add `ex_median` ([`53bd922`](https://example.com/o/n/commit/53bd922))

    ### Fixed

    - Fix the phase sign of `ex_spectrum` on Linux ([#12](https://example.com/o/n/pull/12))

    ## [1.0.0] - 2026-01-01

    _First release._

    [1.1.0]: https://example.com/o/n/compare/v1.0.0...v1.1.0
    [1.0.0]: https://example.com/o/n/releases/tag/v1.0.0
  want: ""

- name: a well-formed file with CRLF line endings passes every rule
  input: |
    # Changelog
    
    ## [1.1.0] - 2026-02-01
    
    ### Changed
    
    - **Breaking:** rename `ex_mean` to `ex_average` ([#14](https://example.com/o/n/pull/14))
    - Raise the minimum CMake version to 3.21 ([#13](https://example.com/o/n/pull/13), [#15](https://example.com/o/n/issues/15))
    
    ### Added
    
    - Add `ex_median` ([`53bd922`](https://example.com/o/n/commit/53bd922))
    
    ### Fixed
    
    - Fix the phase sign of `ex_spectrum` on Linux ([#12](https://example.com/o/n/pull/12))
    
    ## [1.0.0] - 2026-01-01
    
    _First release._
    
    [1.1.0]: https://example.com/o/n/compare/v1.0.0...v1.1.0
    [1.0.0]: https://example.com/o/n/releases/tag/v1.0.0
  want: ""

- name: another title and text before the first release
  rule: Structure.yml
  input: |
    # History

    All notable changes are listed here.

    ## [1.1.0] - 2026-02-01

    ### Changed

    - **Breaking:** rename `ex_mean` to `ex_average` ([#14](https://example.com/o/n/pull/14))
    - Raise the minimum CMake version to 3.21 ([#13](https://example.com/o/n/pull/13), [#15](https://example.com/o/n/issues/15))

    ### Added

    - Add `ex_median` ([`53bd922`](https://example.com/o/n/commit/53bd922))

    ### Fixed

    - Fix the phase sign of `ex_spectrum` on Linux ([#12](https://example.com/o/n/pull/12))

    ## [1.0.0] - 2026-01-01

    _First release._

    [1.1.0]: https://example.com/o/n/compare/v1.0.0...v1.1.0
    [1.0.0]: https://example.com/o/n/releases/tag/v1.0.0
  want: |
    1:1:Changelog.Structure:The file opens with '# Changelog'.
    3:1:Changelog.Structure:Nothing comes between the title and the first release.

- name: a file with no release
  rule: Structure.yml
  input: |
    # Changelog
  want: |
    1:1:Changelog.Structure:The file has no release heading.

- name: releases and sections out of order, an empty section, a wrapped entry and an entry outside a section
  rule: Structure.yml
  input: |
    # Changelog

    ## [1.0.0] - 2026-01-01

    - Add an entry outside a section

    ### Added

    - Add a change that is wrapped
      onto a second line

    ### Changed

    - Change X

    ### Fixed

    ## [1.1.0] - 2026-02-01

    _Second release._

    [1.1.0]: https://example.com/o/n/compare/v1.0.0...v1.1.0
    [1.0.0]: https://example.com/o/n/compare/v0.9.0...v1.0.0
  want: |
    5:1:Changelog.Structure:An entry comes under a section heading.
    10:1:Changelog.Structure:A release holds a notice in italics, section headings and one-line entries starting '- ', and nothing else.
    12:1:Changelog.Structure:Sections appear once each, in the order Changed, Added, Removed, Fixed.
    16:1:Changelog.Structure:The section has no entry.
    18:1:Changelog.Structure:Releases run from newest to oldest.
    23:1:Changelog.Structure:The link for 1.0.0 compares from v1.1.0, the release before it.

- name: a breaking entry after a plain one, a second notice and an empty release
  rule: Structure.yml
  input: |
    # Changelog

    ## [1.1.0] - 2026-02-01

    _A notice._

    ### Changed

    - Raise the minimum CMake version
    - **Breaking:** rename `ex_mean`

    _A second notice._

    ## [1.0.0] - 2026-01-01

    [1.1.0]: https://example.com/o/n/compare/v1.0.0...v1.1.0
    [1.0.0]: https://example.com/o/n/releases/tag/v1.0.0
  want: |
    10:1:Changelog.Structure:Breaking entries come first in their section.
    12:1:Changelog.Structure:A release has one notice at most, directly under its heading.
    14:1:Changelog.Structure:The release has neither a section nor a notice.

- name: links that do not match the releases
  rule: Structure.yml
  input: |
    # Changelog

    ## [1.2.0] - 2026-03-01

    ### Added

    - Add A

    ## [1.1.0] - 2026-02-01

    ### Added

    - Add B

    ## [1.0.0] - 2026-01-01

    ### Added

    - Add C

    [1.2.0]: https://example.com/o/n/compare/v1.0.0...v1.2.0
    [1.0.0]: https://example.com/o/n/compare/v1.0.0...v1.0.0
    [0.9.0]: https://example.com/o/n/compare/v0.8.0...v0.9.0
    [0.8.0]: http://example.com/o/n/compare/v0.7.0...v0.8.0
    [0.7.0]: https://example.com/o/n/releases/tag/v0.6.0
    - Add D
  want: |
    9:1:Changelog.Structure:Release 1.1.0 has no link at the foot of the file.
    21:1:Changelog.Structure:The link for 1.2.0 compares from v1.1.0, the release before it.
    22:1:Changelog.Structure:The link for 1.0.0 compares from an earlier version.
    23:1:Changelog.Structure:The link for 0.9.0 matches no release heading.
    24:1:Changelog.Structure:A link has the form '[X.Y.Z]: https://.../compare/vA.B.C...vX.Y.Z' or '[X.Y.Z]: https://.../releases/tag/vX.Y.Z'.
    25:1:Changelog.Structure:A link has the form '[X.Y.Z]: https://.../compare/vA.B.C...vX.Y.Z' or '[X.Y.Z]: https://.../releases/tag/vX.Y.Z'.
    26:1:Changelog.Structure:The links come after the last release, and this line is not a link.

- name: a release heading without brackets and a dash
  rule: ReleaseHeading.yml
  input: |
    # Changelog

    ## 1.0.0 (2026-01-01)
  want: |
    3:1:Changelog.ReleaseHeading:A release heading has the form '## [X.Y.Z] - YYYY-MM-DD'.

- name: the four section names pass
  rule: SectionName.yml
  input: |
