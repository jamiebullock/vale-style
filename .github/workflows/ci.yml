name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-vale

      - name: Test the rules
        run: make test

      - name: Check the prose
        run: make prose

      - name: Check the version
        run: make version

      - name: Check a project that takes the package from the archive
        run: make package
