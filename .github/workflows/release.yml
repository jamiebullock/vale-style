name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Publish the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Publish the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version."
            exit 1
          fi
          git archive --format=zip --prefix=vale-style/ --output vale-style.zip "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" vale-style.zip \
            --verify-tag \
            --title "vale-style $version" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
