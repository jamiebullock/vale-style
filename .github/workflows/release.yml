name: Release

# main holds releases only, so every push to main is a release. This workflow
# tags the pushed commit with the version in the VERSION file and publishes the
# package archive built from that commit.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the version
        run: make version

      - name: Tag the pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
            tagged="$(git rev-list -n 1 "$tag")"
            if [ "$tagged" = "$GITHUB_SHA" ]; then
              echo "$tag already points at this commit."
              exit 0
            fi
            echo "$tag already points at $tagged and this push is $GITHUB_SHA: VERSION was not raised for this release."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "vale-style $version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"

      - name: Publish the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag is already published."
            exit 0
          fi
          git archive --format=zip --prefix=vale-style/ --output vale-style.zip "$GITHUB_SHA"
          gh release create "$tag" vale-style.zip \
            --verify-tag \
            --title "vale-style $version" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)."
