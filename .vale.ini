StylesPath = styles
MinAlertLevel = suggestion
Vocab = Programming
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[formats]
i = c
tengo = c
COMMIT_EDITMSG = md

[*.md]
BasedOnStyles = Plain
ai-tells.ConsequenceClause = warning
ai-tells.BareHolds = warning
ai-tells.NegatedObject = warning
ai-tells.UniversalSubject = warning
ai-tells.SemicolonUsage = warning

[*CHANGELOG.md]
BasedOnStyles = Plain, Changelog

[*.{c,h,i}]
BasedOnStyles = Plain, Comments, Licence
View = C
Licence.Hash = NO

[*.{cc,cpp,cxx,hh,hpp,hxx}]
BasedOnStyles = Plain, Comments, Licence
View = C
Comments.LineComment = NO
Licence.Hash = NO

[*.tengo]
BasedOnStyles = Plain, Comments, Licence
View = C
Comments.LineComment = NO
Licence.Hash = NO

[{*CMakeLists.txt,*.cmake,*Makefile,*.mk,*.py}]
BasedOnStyles = Licence
Licence.Block = NO

[*COMMIT_EDITMSG]
BasedOnStyles = Plain, Commit
View = Commit
ai-tells.ConsequenceClause = warning
ai-tells.BareHolds = warning
ai-tells.NegatedObject = warning
ai-tells.UniversalSubject = warning
ai-tells.SemicolonUsage = warning

[*PR_BODY.md]
BasedOnStyles = Plain, PullRequest
